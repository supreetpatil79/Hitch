AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Hitch - Cloud-Native Peer-to-Peer Commuter Crowd-Shipping Platform SAM Template

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME: !Ref HitchTable

Resources:
  # ============================================================================
  # DYNAMODB SINGLE-TABLE STORE
  # ============================================================================
  HitchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HitchTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============================================================================
  # S3 BUCKET FOR PACKAGE INTAKE VAULT
  # ============================================================================
  HitchPackageVault:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "hitch-package-vault-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  # ============================================================================
  # SQS NOTIFICATION QUEUE FOR WORKFLOW TASK TOKENS
  # ============================================================================
  CarrierNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hitch-carrier-notification-queue
      VisibilityTimeout: 300

  # ============================================================================
  # API GATEWAY (HTTP API)
  # ============================================================================
  HitchApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: HitchApi
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
          - x-amz-meta-sender-id
          - x-amz-meta-request-id
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  # ============================================================================
  # LAMBDA FUNCTIONS
  # ============================================================================
  S3PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/s3_presign/
      Handler: app.lambda_handler
      Environment:
        Variables:
          INTAKE_BUCKET_NAME: !Sub "hitch-package-vault-${AWS::AccountId}-${AWS::Region}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "hitch-package-vault-${AWS::AccountId}-${AWS::Region}"
      Events:
        PresignApi:
          Type: HttpApi
          Properties:
            Path: /intake/presign
            Method: POST
            ApiId: !Ref HitchApi

  BedrockInspectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/bedrock_inspector/
      Handler: app.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
          BEDROCK_REGION: !Ref AWS::Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HitchTable
        - S3ReadPolicy:
            BucketName: !Sub "hitch-package-vault-${AWS::AccountId}-${AWS::Region}"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        S3ImageUploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref HitchPackageVault
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: intake/

  HandshakeServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/handshake_service/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HitchTable
        - Statement:
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"
      Events:
        HandshakeApi:
          Type: HttpApi
          Properties:
            Path: /handshake/verify
            Method: POST
            ApiId: !Ref HitchApi

  BedrockChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/bedrock_chat/
      Handler: app.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
          BEDROCK_REGION: !Ref AWS::Region
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        ChatAdvisorApi:
          Type: HttpApi
          Properties:
            Path: /chat/advisor
            Method: POST
            ApiId: !Ref HitchApi

  # ============================================================================
  # STEP FUNCTIONS STATE MACHINE
  # ============================================================================
  HitchDeliveryStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: HitchDeliveryStateMachine
      DefinitionUri: workflows/delivery_workflow.asl.json
      DefinitionSubstitutions:
        TABLE_NAME: !Ref HitchTable
        CARRIER_NOTIF_QUEUE_URL: !Ref CarrierNotificationQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HitchTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CarrierNotificationQueue.QueueName

Outputs:
  HitchApiUrl:
    Description: "HTTP API Gateway endpoint URL"
    Value: !Sub "https://${HitchApi}.execute-api.${AWS::Region}.amazonaws.com"
  PackageVaultBucketName:
    Description: "S3 Package Vault Bucket Name"
    Value: !Ref HitchPackageVault
  DynamoDBTableName:
    Description: "DynamoDB Single Table Name"
    Value: !Ref HitchTable
  BedrockInspectorFunctionArn:
    Description: "Bedrock Inspector Lambda Function ARN"
    Value: !GetAtt BedrockInspectorFunction.Arn
  DeliveryStateMachineArn:
    Description: "Step Functions Delivery Lifecycle State Machine ARN"
    Value: !Ref HitchDeliveryStateMachine
